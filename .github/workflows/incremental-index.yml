name: Incremental Knowledge Indexing

on:
  push:
    branches:
      - feature/multi-platform-error-intelligence
    paths:
      - "data/knowledge/**"
      - "scripts/incremental_index.py"
      - ".github/workflows/incremental-index.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::620902420632:role/GitHubActions-RAG-V2-Indexer
          aws-region: ap-south-1

      - name: Run incremental indexing
        run: python -m scripts.incremental_index

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/embeddings/chunk_embeddings.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update RAG knowledge embeddings"
            git push
          fi
